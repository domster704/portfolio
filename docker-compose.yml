services:
  front:
    build: portfolio-front
    ports:
      - "8080:3000"
    restart: always
    container_name: portfolio

  strapi:
    container_name: strapi
    build: portfolio-cms
    image: strapi:latest
    restart: always
    env_file: .env
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: postgres-strapi
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      APP_KEYS: ${APP_KEYS}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - ./portfolio-cms/config:/opt/app/config
      - ./portfolio-cms/src:/opt/app/src
      - ./portfolio-cms/package.json:/opt/package.json
      - ./portfolio-cms/yarn.lock:/opt/yarn.lock
      - ./portfolio-cms/.env:/opt/app/.env
      - ./portfolio-cms/public/uploads:/opt/app/public/uploads
    ports:
      - "1337:1337"
    depends_on:
      - postgres-strapi

  postgres-strapi:
    image: postgres:18-trixie
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - strapi-data:/var/lib/postgresql
    ports:
      - ${DATABASE_PORT}:5432
    restart: always

volumes:
  strapi-data:
